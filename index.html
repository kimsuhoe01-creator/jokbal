<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>족발신선생 박닌점 메뉴</title>
  <meta name="description" content="족발신선생 박닌점 태블릿 메뉴" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#2b1407" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="족발신선생" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section id="langScreen" class="lang-screen">
    <div class="lang-box">
      <img class="lang-logo" src="logo.png" alt="족발신선생" onerror="this.style.display='none'">
      <p class="branch">Bắc Ninh</p>
      <h1>언어를 선택해주세요</h1>
      <div class="lang-grid">
        <button data-lang="ko">한국어</button><button data-lang="vi">Tiếng Việt</button>
        <button data-lang="en">English</button><button data-lang="zh">中文</button>
      </div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="logo" src="logo.png" alt="족발신선생" onerror="this.style.display='none'">
        <div class="store-text"><strong data-t="storeName">족발신선생 박닌점</strong><span>JOKBAL HOUSE · BẮC NINH</span></div>
      </div>
      <div class="top-actions">
        <div class="quick-lang" aria-label="language selector">
          <button type="button" data-switch-lang="ko">KR</button><button type="button" data-switch-lang="vi">VN</button>
          <button type="button" data-switch-lang="en">EN</button><button type="button" data-switch-lang="zh">中文</button>
        </div>
        <a class="map-btn" href="https://maps.app.goo.gl/QWM1S2fRp7ZgiRug9" target="_blank" rel="noopener">📍 <span>지도</span></a>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="sideNav" class="side-nav" aria-label="menu categories"></nav>
        <div class="service-box">
          <strong>🎁 홀 무료 서비스</strong>
          <p>쟁반국수 또는 고르곤졸라피자<br>+ 짬뽕순두부 + 계란찜</p>
          <small>※ 미니족 메뉴 · 1인 메뉴 · 식사 메뉴 제외</small>
        </div>
      </aside>

      <div class="main-panel">
        <section class="hero">
          <img src="images/half-oven.jpg" alt="화덕 반반메뉴">
          <div class="hero-shade"></div>
          <div class="hero-copy">
            <span>🔥 500°C 화덕의 맛</span>
            <h1>화덕 반반메뉴</h1>
            <p>족발 · 보쌈 · 매운족발 · 냉채족발 · 매운보쌈 · 화덕족발 · 화덕보쌈 중 2가지 선택</p>
          </div>
        </section>
        <nav id="catNav" class="cat-nav" aria-label="menu categories"></nav>
        <main id="menu" class="menu"></main>
      </div>
    </div>
  </div>

  <div id="photoModal" class="modal hidden" role="dialog" aria-modal="true">
    <button id="modalClose" class="modal-close" type="button">×</button><img id="modalImg" alt="menu photo"><div id="modalCaption" class="modal-caption"></div>
  </div>
  <button id="toTop" class="to-top hidden" type="button">▲</button>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
