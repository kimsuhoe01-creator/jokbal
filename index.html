<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1708" />
  <title>족발신선생 박닌점 메뉴</title>
  <meta name="description" content="족발신선생 박닌점 태블릿 메뉴" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260715-2" />
</head>
<body>
  <section id="langScreen" class="lang-screen">
    <div class="lang-box">
      <img class="lang-logo" src="logo.png" alt="족발신선생" onerror="this.style.display='none'">
      <p class="branch">Bắc Ninh</p>
      <h1>언어를 선택해주세요 · Select language</h1>
      <div class="lang-grid">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="vi">Tiếng Việt</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="logo" src="logo.png" alt="족발신선생" onerror="this.style.display='none'">
        <div class="store-text">
          <strong data-t="storeName">족발신선생 박닌점</strong>
          <span>JOKBAL HOUSE · BẮC NINH</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="quick-lang" aria-label="language selector">
          <button type="button" data-switch-lang="ko">KR</button>
          <button type="button" data-switch-lang="vi">VN</button>
          <button type="button" data-switch-lang="en">EN</button>
          <button type="button" data-switch-lang="zh">中文</button>
        </div>
        <button id="completeOrderButton" class="complete-order-btn" type="button" aria-label="직원 보기 · Xem cho nhân viên">
          <span class="complete-order-label">👨‍🍳 <span>직원 보기 · Tiếng Việt</span></span>
          <b id="completeOrderCount" aria-label="장바구니 수량">0</b>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="sideNav" class="side-nav" aria-label="menu categories"></nav>
      </aside>

      <div class="main-panel">
        <section id="hallService" class="service-banner" role="note" aria-live="polite">
          <div class="service-icon" aria-hidden="true">🎁</div>
          <div class="service-copy">
            <span class="service-eyebrow" data-t="freeServiceTarget">적용 메인메뉴 주문 고객</span>
            <strong data-t="freeServiceTitle">홀 무료 서비스</strong>
            <p class="service-choice-title" data-t="freeServiceChoiceTitle">아래 2개 중 1개를 선택해주세요</p>
            <div class="service-choice-row">
              <span class="service-choice"><b aria-hidden="true">🍜</b><span data-t="freeServiceNoodle">쟁반국수</span></span>
              <em data-t="freeServiceOr">또는</em>
              <span class="service-choice"><b aria-hidden="true">🍕</b><span data-t="freeServicePizza">고르곤졸라피자</span></span>
            </div>
            <p class="service-plus" data-t="freeServiceIncluded">+ 짬뽕순두부 + 계란찜도 함께 무료</p>
            <small data-t="freeServiceNote">※ 미니족 메뉴 · 1인 메뉴 · 식사 메뉴 제외</small>
          </div>
          <span class="service-tag" data-t="dineInOnly">홀 식사 한정</span>
        </section>

        <section class="hero">
          <img src="images/half-oven.jpg" alt="화덕 반반메뉴">
          <div class="hero-shade"></div>
          <div class="hero-copy">
            <span data-t="heroKicker">🔥 500°C 화덕의 맛</span>
            <h1 data-t="heroTitle">화덕 반반메뉴</h1>
            <p data-t="heroDescription">족발 · 보쌈 · 매운족발 · 냉채족발 · 매운보쌈 · 화덕족발 · 화덕보쌈 중 2가지 선택</p>
          </div>
        </section>

        <nav id="catNav" class="cat-nav" aria-label="menu categories"></nav>
        <main id="menu" class="menu"></main>
      </div>
    </div>
  </div>

  <div id="photoModal" class="modal hidden" role="dialog" aria-modal="true">
    <button id="modalClose" class="modal-close" type="button" aria-label="close">×</button>
    <img id="modalImg" alt="menu photo">
    <div id="modalCaption" class="modal-caption"></div>
  </div>
  <button id="toTop" class="to-top hidden" type="button" aria-label="top">▲</button>
  <script src="js/app.js?v=20260715-2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
